# GDPR: disable all Hugo built-in privacy-sensitive services
# Even though Polform uses none, this prevents accidental activation
[privacy]
  [privacy.disqus]
    disable = true
  [privacy.googleAnalytics]
    disable = true
  [privacy.instagram]
    disable = true
  [privacy.vimeo]
    disable = true
  [privacy.youTube]
    disable = true
  [privacy.x]
    disable = true


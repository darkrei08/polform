<dialog id="search-modal" class="search-dialog" aria-label="Ricerca interna nel catalogo" data-empty-prompt="Inizia a digitare per cercare tra i materiali e i settori Polform." data-no-results-prompt="Nessun materiale o settore corrispondente a">
  <div class="search-dialog-inner">
    <div class="search-header">
      <div class="search-input-wrap">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="search" id="search-input" class="search-input" placeholder="Cerca materiali, settori, densità, normative 1IM..." autocomplete="off">
      </div>
      <button type="button" id="search-close-btn" class="search-close-btn" aria-label="Chiudi ricerca">Esc</button>
    </div>

    <div id="search-results" class="search-results">
      <div class="search-empty-state">
        Inizia a digitare per cercare tra tutti i settori industriali e le schede tecniche dei materiali Polform.
      </div>
    </div>
  </div>
</dialog>

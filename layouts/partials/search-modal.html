<dialog id="search-modal" class="search-dialog" aria-label="{{ T "search_dialog_label" }}" data-empty-prompt="{{ T "search_empty_prompt" }}" data-no-results-prompt="{{ T "search_no_results_prompt" }}">
  <div class="search-dialog-inner">
    <div class="search-header">
      <div class="search-input-wrap">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <label class="visually-hidden" for="search-input">{{ T "search_input_label" }}</label>
        <input type="search" id="search-input" class="search-input" placeholder="{{ T "search_input_placeholder" }}" autocomplete="off">
      </div>
      <button type="button" id="search-close-btn" class="search-close-btn" aria-label="{{ T "search_close_label" }}">Esc</button>
    </div>

    <div id="search-results" class="search-results">
      <div class="search-empty-state">
        {{ T "search_empty_state" }}
      </div>
    </div>
  </div>
</dialog>

# -- History Section --
[history_tag]
other = "Fertigungswurzeln"

[history_title]
other = "Über 27 Jahre Polyurethan-Meisterschaft"

[history_p1]
other = "Die Polform S.r.l. wurde im <strong>Januar 1999</strong> in Matera von den <strong>Gründungspartnern</strong> gegründet, nach über einem Jahrzehnt praktischer Betriebserfahrung in der Polyurethanschaum- und Dacron-Verarbeitung im Industriecluster Matera-Bari."

[history_p2]
other = "Tiefes Wissen über die physikalische Chemie der Schaumstoffe und Präzision im Konturschnitt haben das Unternehmen zu einem dauerhaften Referenzpunkt gemacht, das sich heute in die fortschrittlichsten italienischen technischen und industriellen Märkte weiterentwickelt."


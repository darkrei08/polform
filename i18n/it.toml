# -- History Section --
[history_tag]
other = "Radici Manifatturiere"

[history_title]
other = "Oltre 27 Anni di Maestria nel Poliuretano"

[history_p1]
other = "La Polform S.r.l. nasce nel <strong>gennaio 1999</strong> a Matera dall'iniziativa dei <strong>Soci Fondatori</strong>, dopo oltre un decennio di esperienza operativa diretta nella trasformazione del poliuretano espanso e del dacron nel polo industriale di Matera e Bari."

[history_p2]
other = "La profonda conoscenza chimico-fisica delle schiume e la precisione nel taglio a pantografo hanno reso l'azienda un punto di riferimento duraturo, capace oggi di evolvere verso i più avanzati mercati tecnici e industriali italiani."


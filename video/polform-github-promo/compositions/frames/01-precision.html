  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["01-precision"] = tl;

      const imageShell = document.querySelector(".p01-image-shell");
      const image = document.querySelector(".p01-image");
      const label = document.querySelector(".p01-label");
      const labelRule = document.querySelector(".p01-label-rule");
      const headline = document.querySelector(".p01-headline");
      const words = [...document.querySelectorAll(".p01-word")];
      const underlinePath = document.querySelector("#p01-underline-path");
      const subline = document.querySelector(".p01-subline");
      const corner = document.querySelector(".p01-corner");

      const pathLength = underlinePath.getTotalLength();
      underlinePath.style.strokeDasharray = `${pathLength}`;
      underlinePath.style.strokeDashoffset = `${pathLength}`;

      const CONTENT = [
        { title: "PRECISION FOAM", body: "precision foam", hold: 0.42 },
        { title: "TRANSFORMATION", body: "transformation", hold: 0.56 },
      ];
      const BASE_DURATION = 0.66;
      const SEC_PER_CHAR = 0.035;
      let cumulative = 0;
      const SEQUENCE = CONTENT.map((entry) => {
        const duration = BASE_DURATION + entry.body.length * SEC_PER_CHAR + entry.hold;
        const start = cumulative;
        cumulative += duration;
        return { ...entry, start, end: cumulative };
      });
      const sequenceStart = 1.82;
      const sequenceRun = 2.38;
      const sequenceScale = sequenceRun / cumulative;

      tl.fromTo(imageShell, { x: 170, scale: 1.08, opacity: 0 }, { x: 0, scale: 1, opacity: 1, duration: 0.82, ease: "power2.out" }, 0)
        .fromTo(image, { scale: 1.16 }, { scale: 1, duration: 2.9, ease: "power1.out" }, 0.1)

        .fromTo(labelRule, { scaleX: 0, transformOrigin: "left center", opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.38, ease: "power2.out" }, 0.76)
        .fromTo(headline, { x: -18 }, { x: 0, duration: 0.52, ease: "power2.out" }, 1.8);

      words.forEach((word, index) => {
        const entry = SEQUENCE[Math.min(index, SEQUENCE.length - 1)];
        const start = sequenceStart + entry.start * sequenceScale;
        tl.fromTo(word, { y: 30, opacity: 0, rotationX: -18 }, { y: 0, opacity: 1, rotationX: 0, duration: 0.42, ease: "power2.out" }, start);

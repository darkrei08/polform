    var tl = gsap.timeline({ paused: true });
    var titleText = document.getElementById("f05-contact-title-text");
    var cursor = document.getElementById("f05-contact-cursor");
    var titleSequence = [
      { t: 0.0, text: "" },
      { t: 0.24, text: "NO" },
      { t: 0.52, text: "NO C" },
      { t: 0.82, text: "NO COM" },
      { t: 1.12, text: "NO COMPLEX" },
      { t: 1.48, text: "NO COMPLEX F" },
      { t: 1.72, text: "NO COMPLEX FORMS" },
    ];

    function titleAt(time) {
      for (var i = titleSequence.length - 1; i >= 0; i -= 1) {
        if (time >= titleSequence[i].t) return titleSequence[i].text;
      }
      return "";
    }

    var titleDriver = { t: 0 };
    tl.to(titleDriver, {
      t: 2,
      duration: 2,
      ease: "none",
      onUpdate: function () {
        titleText.textContent = titleAt(titleDriver.t);
      },
    }, 0);

    var blinkDriver = { p: 0 };
    tl.to(blinkDriver, {
      p: Math.PI * 2 * 3,
      duration: 2,
      ease: "none",
      onUpdate: function () {
        cursor.style.opacity = Math.sin(blinkDriver.p) > 0 ? "1" : "0";
      },
    }, 0);

    tl.fromTo("#f05-contact-plate", { opacity: 0, scale: 1.025 }, { opacity: 1, scale: 1, duration: 0.55, ease: "power2.out" }, 2.0);

    var paths = [

      { id: "#f05-contact-send", label: "SEND CAD", hold: 0.65 },
    ];
    var cumulative = 0;

      var start = 2.15 + cumulative;
      cumulative += 0.28 + entry.label.length * 0.045 + entry.hold;
      return { id: entry.id, start: start };
    });
